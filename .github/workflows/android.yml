name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
    paths-ignore:
      - 'windows-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Pre-download OpenSSL source tarball
        run: |
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://mirror.math.princeton.edu/pub/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "http://mirrors.ibiblio.org/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1s/openssl-1.1.1s.tar.gz"
          cp openssl-1.1.1s.tar.gz app/ || true
          cp openssl-1.1.1s.tar.gz lib/ || true
          ls -lh openssl-1.1.1s.tar.gz

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.9
          name: "PS Translator v2.0.9 (Smart Subtitle Cascade & Custom Styling)"
          body: |
            ### 🎮 PS Translator v2.0.9 (Android APK & Samsung DeX)

            แอปพลิเคชันสตรีมเกม PlayStation 5 (PS5) พร้อมระบบแปลภาษาและพากย์เสียงไทยแบบเรียลไทม์ สำหรับอุปกรณ์ Android และ Samsung DeX (`PS-Translator.apk`)

            ---

            #### 🌟 ไฮไลต์ฟีเจอร์ใหม่ในเวอร์ชัน 2.0.9:
            - **Smart Subtitle Cascade (ระบบประวัติซับเรียงซ้อนให้อ่านทัน):**
              - เมื่อมีบทสนทนาใหม่ขึ้นมา ซับอันเก่าจะไม่หายไปในทันที แต่จะถูกเลื่อนถัดลงมาข้างล่าง เพื่อให้ผู้เล่นอ่านบทพูดได้ทันเวลา
              - ซับบทพูดเก่าจะค่อยๆ ปรับความโปร่งแสงให้จางลง (Fade Alpha) ตามลำดับ เพื่อให้สายตาโฟกัสบทพูดล่าสุดได้อย่างชัดเจน
              - เมื่อบทพูดเก่าล้นจำนวนแถว (1-3 แถวตามที่ตั้งค่าไว้) จะค่อยๆ หายไปโดยอัตโนมัติ
            - **Center Screen Subtitle (ซับขึ้นตรงกลางหน้าจอ):**
              - ซับไตเติ้ลใหม่จะปรากฏขึ้นบริเวณ **ตรงกลางหน้าจอ (Center)** อย่างเด่นชัด และบทพูดเก่าจะเรียงซ้อนอยู่ด้านล่าง หรือเลือกสลับเป็น **ด้านล่างจอ (Bottom)** ได้ตามความสะดวก
            - **Custom Text Styling (ปรับแต่งตัวหนังสือ สี ขนาด ได้อิสระ):**
              - **สีตัวหนังสือ 6 สี:** ขาวสว่าง, เขียวนีออน, ฟ้าไซเบอร์, เหลืองทองสไตล์ภาพยนตร์, ส้มสด, ชมพูหวาน
              - **ขนาดตัวหนังสือ:** ปุ่มทางลัด (เล็ก 18sp, กลาง 22sp, ใหญ่ 26sp, ใหญ่พิเศษ 34sp) พร้อมปุ่มปรับละเอียด `A-` และ `A+`
              - **ความโปร่งใสของพื้นหลังกล่องซับ:** ใส 0%, โปร่งแสงกระจก 40%, กึ่งทึบ 80%, ดำทึบ 100%
              - **ตัวอย่างการแสดงผลแบบสด (Live Preview):** แสดงกล่องตัวอย่างในเมนูการตั้งค่าแบบเรียลไทม์ขณะเลือกปรับ
            - **Samsung DeX & Multi-Window:** รองรับการทำงานแบบ Pop-up / ย่อขยายหน้าต่าง / สตรีมเกมต่อเนื่องขณะทำงานอื่นบน DeX
            - **Mute Game Audio & Thai Voice Dubbing:** ปิดเฉพาะเสียงเกม และระบบวิเคราะห์เสียงพากย์ชาย-หญิง

            ---

            ### 📦 ไฟล์ติดตั้ง
            - ดาวน์โหลด: **`PS-Translator.apk`**
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
