name: Build PS Translator Windows 11 App

on:
  push:
    branches: [ main ]
    paths:
      - 'windows-app/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64 GCC & OpenSSL
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl

      - name: Download FFmpeg Shared SDK & Compile Native libchiaki Bridge (chiaki_win_bridge.dll)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "windows-app/native_dlls" | Out-Null

          Write-Host "Downloading FFmpeg Win64 Shared SDK..."
          curl.exe -L -sS -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-sdk -Force
          $ffDir = Get-ChildItem -Path ffmpeg-sdk -Directory | Select-Object -First 1
          Write-Host "FFmpeg SDK extracted to: $($ffDir.FullName)"

          $mingwDir = if (Test-Path "$env:RUNNER_TEMP\msys64\mingw64\bin\gcc.exe") { "$env:RUNNER_TEMP\msys64\mingw64" } else { "C:\msys64\mingw64" }
          Write-Host "Using MinGW64 directory: $mingwDir"
          $env:PATH = "$mingwDir\bin;$env:PATH"

          $libSrcs = Get-ChildItem "lib/src/*.c" | Where-Object { $_.Name -notmatch "^(ffmpegdecoder|pidecoder|opusdecoder)\.c$" } | ForEach-Object { $_.FullName }
          $gfSrcs = @(
            "third-party/gf-complete/src/gf.c",
            "third-party/gf-complete/src/gf_wgen.c",
            "third-party/gf-complete/src/gf_w4.c",
            "third-party/gf-complete/src/gf_w8.c",
            "third-party/gf-complete/src/gf_w16.c",
            "third-party/gf-complete/src/gf_w32.c",
            "third-party/gf-complete/src/gf_w64.c",
            "third-party/gf-complete/src/gf_w128.c",
            "third-party/gf-complete/src/gf_rand.c",
            "third-party/gf-complete/src/gf_general.c",
            "third-party/gf-complete/src/gf_cpu.c"
          )
          $jerasureSrcs = @(
            "third-party/jerasure/src/galois.c",
            "third-party/jerasure/src/jerasure.c",
            "third-party/jerasure/src/reed_sol.c",
            "third-party/jerasure/src/cauchy.c",
            "third-party/jerasure/src/liberation.c"
          )
          $nanopbSrcs = @(
            "third-party/nanopb/pb_common.c",
            "third-party/nanopb/pb_decode.c",
            "third-party/nanopb/pb_encode.c"
          )

          $allSrcs = @(
            "windows-app/native/chiaki_win_bridge.c",
            "windows-app/native/takion.pb.c"
          ) + $nanopbSrcs + $gfSrcs + $jerasureSrcs + $libSrcs

          Write-Host "Compiling chiaki_win_bridge.dll with MinGW64 gcc..."
          & "$mingwDir\bin\gcc.exe" -shared -O2 `
            -Wno-int-conversion `
            -Wno-incompatible-pointer-types `
            -Wno-pointer-to-int-cast `
            -D_WIN32_WINNT=0x0601 `
            '-DCHIAKI_VERSION="2.1.1"' `
            -DPB_C99_STATIC_ASSERT `
            -DOPENSSL_SUPPRESS_DEPRECATED `
            -Iwindows-app/native/include `
            -Iwindows-app/native `
            -Ilib/include `
            -Ithird-party/nanopb `
            -Ithird-party/gf-complete/include `
            -Ithird-party/jerasure/include `
            "-I$($ffDir.FullName)/include" `
            "-I$mingwDir/include" `
            @allSrcs `
            -o "windows-app/native_dlls/chiaki_win_bridge.dll" `
            "-L$($ffDir.FullName)/lib" `
            "-L$mingwDir/lib" `
            -lavcodec -lswscale -lavutil -lcrypto -lws2_32 -lwsock32 -lbcrypt -lpthread

          if (-not (Test-Path "windows-app/native_dlls/chiaki_win_bridge.dll")) {
            throw "Failed to build chiaki_win_bridge.dll"
          }

          # Copy FFmpeg runtime DLLs and MinGW runtime DLLs into native_dlls
          Copy-Item "$($ffDir.FullName)/bin/avcodec-*.dll" "windows-app/native_dlls/" -Force
          Copy-Item "$($ffDir.FullName)/bin/avutil-*.dll" "windows-app/native_dlls/" -Force
          Copy-Item "$($ffDir.FullName)/bin/swscale-*.dll" "windows-app/native_dlls/" -Force
          Copy-Item "$($ffDir.FullName)/bin/swresample-*.dll" "windows-app/native_dlls/" -Force -ErrorAction SilentlyContinue

          Copy-Item "$mingwDir\bin\libcrypto-*.dll" "windows-app/native_dlls/" -Force
          Copy-Item "$mingwDir\bin\libwinpthread-1.dll" "windows-app/native_dlls/" -Force -ErrorAction SilentlyContinue
          Copy-Item "$mingwDir\bin\libgcc_s_seh-1.dll" "windows-app/native_dlls/" -Force -ErrorAction SilentlyContinue
          Copy-Item "$mingwDir\bin\zlib1.dll" "windows-app/native_dlls/" -Force -ErrorAction SilentlyContinue

          Get-ChildItem "windows-app/native_dlls"

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File Self-Contained PS-Translator-Windows.exe
        shell: pwsh
        run: |
          dotnet publish windows-app/PSTranslatorWin.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish-win

          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item "publish-win/PS-Translator-Windows.exe" "dist-win/PS-Translator-Windows.exe"
          Get-ChildItem dist-win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-Windows11
          path: dist-win/PS-Translator-Windows.exe

      - name: Attach Windows 11 Native Chiaki Translator to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.8
          name: "PS Translator v2.0.8 (Native Chiaki Windows 11 .EXE & Android .APK)"
          body: |
            ### PS Translator v2.0.8 (Native Chiaki Windows 11 & Android APK)

            #### 1. สำหรับคอมพิวเตอร์ Windows 11 (`PS-Translator-Windows.exe` ไฟล์เดียวจบ)
            - **Native Chiaki Converted into Translator (เหมือนแอปมือถือ APK 100%):** แปลงโปรแกรมสตรีม PS5/PS4 (`libchiaki`) ให้มีระบบแปลซับไตเติ้ลและพากย์เสียงไทยในตัว ค้นหาเครื่อง PS5 ในวงแลน ลงทะเบียนด้วย PIN 8 หลัก ปลุกเครื่องจาก Rest Mode และสตรีมภาพ/เสียง/จอยเกม พร้อมแปลซับไตเติ้ลในโปรแกรมเดียว ไม่ต้องเปิดหลายโปรแกรม
            - **แสดงคำแปลอยู่ในหน้าต่างโปรแกรม (ไม่ลอยนอกหน้าต่าง):** กล่องซับไตเติ้ลและกรอบเขียวเลือกพื้นที่ซับไตเติ้ลอยู่ในหน้าต่างของโปรแกรมโดยตรง พร้อมโหมดขยายเต็มจอ (`F11`) และโหมดจอดำโชว์เฉพาะตัวหนังสือ
            - **ปรับขนาดและสีตัวหนังสือได้อิสระ:** ปรับขนาดตัวหนังสือภาษาไทย (16-72 px) และภาษาอังกฤษ (11-40 px) เลือกสีตัวหนังสือได้ตามต้องการ (เหลืองทอง, ขาว, เขียว, ฟ้าสว่าง, ชมพู, ส้ม) และปรับความทึบพื้นหลังกล่องซับได้
            - **ปุ่มปิดเสียงเกมในตัว:** ปิดเฉพาะเสียงเกมจากสตรีม PS5 เพื่อให้ได้ยินเสียงพากย์ไทย AI (ชาย/หญิง/อัตโนมัติ) ชัดเจนโดยเสียงไม่ซ้อนกัน

            #### 2. สำหรับมือถือและแท็บเล็ต Android (`PS-Translator.apk`)
            - **Fixed Voice Gender Mapping:** แก้ไขปัญหาการเลือกเสียงชายและหญิงสลับกันให้ตรงตามเพศจริง 100%
            - **Active Button Highlight UI:** เพิ่มแถบสีไฮไลท์สีเขียวชัดเจนบนปุ่มตัวเลือกที่กำลังใช้งานอยู่
            - **1080p Ultra-Clear OCR & Smart Corrector:** รองรับการตรวจจับซับไตเติ้ลความละเอียดสูง 1080p พร้อมขยายสเกล 2 เท่า และระบบแก้คำผิด c/e อัตโนมัติ
          files: |
            dist-win/PS-Translator-Windows.exe
          token: ${{ secrets.GITHUB_TOKEN }}
