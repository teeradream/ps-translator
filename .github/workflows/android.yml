name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
    paths-ignore:
      - 'windows-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Pre-download OpenSSL source tarball
        run: |
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://mirror.math.princeton.edu/pub/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "http://mirrors.ibiblio.org/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1s/openssl-1.1.1s.tar.gz"
          cp openssl-1.1.1s.tar.gz app/ || true
          cp openssl-1.1.1s.tar.gz lib/ || true
          ls -lh openssl-1.1.1s.tar.gz

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.8
          name: "PS Translator v2.0.8 (Samsung DeX & Android APK)"
          body: |
            ### PS Translator v2.0.8 (Android APK & Samsung DeX)

            สำหรับมือถือ แท็บเล็ต Android และโหมด Samsung DeX (`PS-Translator.apk`)

            #### จุดเด่นและฟังก์ชั่นการทำงาน:
            - **Full Samsung DeX & Multi-Window Support:** รองรับการเปิดใช้งานในโหมด **Samsung DeX** และโหมดหลายหน้าต่าง (Multi-Window / Pop-up View) เต็มรูปแบบ สามารถย่อ/ขยายขนาดหน้าต่างอย่างอิสระ สลับหน้าจอระหว่างจอมือถือกับจอแยก DeX และคลิกเมาส์ออกนอกหน้าต่างแอปได้โดยที่สตรีม PS5 และการแปลซับไตเติ้ลทำงานต่อเนื่องไม่หลุด (และไม่กระทบการทำงานแบบเต็มจอบนมือถือปกติ)
            - **Fixed Voice Gender Mapping:** แก้ไขปัญหาการเลือกเสียงชายและหญิงสลับกันให้ตรงตามเพศจริง 100%
            - **Active Button Highlight UI:** เพิ่มแถบสีไฮไลท์สีเขียวชัดเจนบนปุ่มตัวเลือกที่กำลังใช้งานอยู่
            - **1080p Ultra-Clear OCR & Smart Corrector:** รองรับการตรวจจับซับไตเติ้ลความละเอียดสูง 1080p พร้อมขยายสเกล 2 เท่า และระบบแก้คำผิด c/e อัตโนมัติ
            - **Direct Native PS5 Streaming:** สตรีมตรงจากเครื่อง PS5 ภาพลื่นไหล ควบคุมด้วยจอย DualSense หรือทัชสกรีนได้สมบูรณ์แบบ
            - **Real-time Thai Subtitles & Voice Dubbing:** ระบบแปลภาษาไทยแบบเรียลไทม์ พร้อมเสียงพากย์ไทย
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
