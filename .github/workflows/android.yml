name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev protobuf-compiler python3-protobuf libopus-dev ffmpeg libavutil-dev libevdev-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          cp "$APK_FILE" dist/PS-Translator-Native.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0
          name: "PS Translator v2.0.0 (Native PS5 Direct Stream)"
          body: |
            ### PS Translator v2.0.0 — Native PS5 Direct Stream Edition

            - **Direct PS5 Remote Play Streaming:** ดึงสัญญาณภาพสดโดยตรงจากเครื่อง PS5 ในวงแลน (Local LAN) ด้วยเทคโนโลยีสตรีมมิ่งระดับฮาร์ดแวร์แบบ Chiaki
            - **No Controller Interference:** ตัดฟังก์ชันปุ่มจอย / Controller ออกทั้งหมด 100% เล่นเกมด้วยจอย DualSense ปกติที่เครื่อง PS5 ได้ทันที
            - **Real-Time Subtitle Translation & Dubbing:** ระบบ OCR ตรวจจับข้อความซับไตเติ้ลจากภาพเกมและแปลเป็นภาษาไทยแบบเรียลไทม์
            - **Pure Text Fullscreen Monitor:** โหมดแสดงผลเฉพาะตัวหนังสือซับไตเติ้ลบนพื้นหลังสีดำสนิท รองรับทั้งแนวตั้งและแนวนอน
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
