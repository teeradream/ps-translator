name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          cp "$APK_FILE" dist/PS-Translator-Native.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.8
          name: "PS Translator v2.0.8 (Fix Voice Gender Mapping & Add Active Button Highlight UI)"
          body: |
            ### PS Translator v2.0.8

            - **Fixed Voice Gender Mapping:** แก้ไขปัญหาการเลือกเสียงชายและหญิงสลับกัน โดยปรับรหัสจับคู่ชุดเสียง (Voice Model ID) ของ Google TTS ภาษาไทยให้ตรงตามเพศจริง (กดเสียงชายได้เสียงผู้ชาย กดเสียงหญิงได้เสียงผู้หญิง 100%)
            - **Active Button Highlight UI:** เพิ่มแถบสีไฮไลท์สีเขียวชัดเจน (พื้นหลังสีเขียวเข้มและกรอบสีเขียวสว่าง) บนปุ่มตัวเลือกที่กำลังใช้งานอยู่ ทั้งปุ่มเลือกเพศเสียงพากย์ ปุ่มปรับความเร็วเสียงพูด และปุ่มอัตราส่วนภาพ ทำให้มองเห็นได้ทันทีว่ากำลังกดเลือกค่าใดไว้
            - **1080p Ultra-Clear OCR & Smart Corrector:** รองรับการตรวจจับซับไตเติ้ลความละเอียดสูง 1080p พร้อมขยายสเกล 2 เท่า และระบบแก้คำผิด c/e อัตโนมัติ
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
