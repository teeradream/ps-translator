apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.pstranslator.tv"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 232
        versionName "2.3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    signingConfigs {
        release
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    def repoKeystore = file("../app/pstranslator-signing.jks")
    if (repoKeystore.exists()) {
        signingConfigs.release.storeFile = repoKeystore
        signingConfigs.release.storePassword = "pstranslator2026"
        signingConfigs.release.keyAlias = "pstranslator"
        signingConfigs.release.keyPassword = "pstranslator2026"
        buildTypes.release.signingConfig = signingConfigs.release
        buildTypes.debug.signingConfig = signingConfigs.release
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
}
