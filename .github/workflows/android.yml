name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
    paths-ignore:
      - 'windows-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Pre-download OpenSSL source tarball
        run: |
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://mirror.math.princeton.edu/pub/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "http://mirrors.ibiblio.org/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1s/openssl-1.1.1s.tar.gz"
          cp openssl-1.1.1s.tar.gz app/ || true
          cp openssl-1.1.1s.tar.gz lib/ || true
          ls -lh openssl-1.1.1s.tar.gz

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK & Samsung TV WGT
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          cp tizen-tv/PS-Translator-Samsung-TV.wgt dist/PS-Translator-Samsung-TV.wgt
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: |
            dist/*.apk
            dist/*.wgt

      - name: Read app version from build.gradle
        id: ver
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n 1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VER"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "PS Translator ${{ steps.ver.outputs.tag }} (Clean Bold Main Subtitle Font, Fit-Content Borderless Sub Box, Dark Left Tutorial Box & Popup Position Sliders)"
          body: |
            ### 🎮 PS Translator ${{ steps.ver.outputs.tag }} (Android APK, Samsung TV `.wgt` & Samsung DeX)

            แอปพลิเคชันสตรีมเกม PlayStation 5 (PS5) และ PS4 พร้อมระบบตรวจจับซับไตเติล แปลข้อความป๊อปอัพซ้าย/ขวา เอกสารเฉพาะจุด ส่งซับลอยขึ้นทีวี Samsung และพากย์เสียงไทยแบบเรียลไทม์ในดีไซน์ **Vice City & GTA 6 Authentic UI**

            ---

            #### 🌟 ไฮไลต์ฟีเจอร์ล่าสุดในเวอร์ชัน ${{ steps.ver.outputs.version }}:
            - **ฟอนต์ซับหลักหนาคลีนพร้อมเงาหลังตัวหนังสือ (ไม่มีขอบดำซ้อน):**
              - แยกใช้ฟอนต์ **`GTA Art Deco + Prompt SemiBold`** เฉพาะตัวหนังสือซับที่แปลหลักให้น้ำหนักหนาอ่านชัดขึ้นทั้งบนมือถือและทีวี Samsung พร้อมเงาหลังตัวหนังสือแบบเดิม (ส่วนหน้าแรกและเมนูยังคงฟอนต์เดิมคมชัด)
            - **กรอบพื้นหลังซับลอย ไม่มีขอบ ย่อ-ขยายตามความยาวซับ + เปิด/ปิดได้:**
              - ลบเส้นขอบรอบกรอบซับออก ให้เป็นกล่องโปร่งแสงลอยตัวที่ **ย่อ-ขยายพอดีความยาวข้อความซับอัตโนมัติ** พร้อมสวิตช์ **เปิด/ปิดกรอบพื้นหลังซับ** และปรับระดับความโปร่งแสงได้อิสระ
            - **อัปเกรดกล่องป๊อปอัพซ้าย-ขวา (OCR แม่นขึ้น 2x + ดีไซน์แยก + เลื่อนขึ้น-ลงอิสระ):**
              - **ฝั่งซ้าย:** ปรับเป็นกล่อง **สีเทาเข้มเหมือนต้นฉบับเกม** ไม่มีชื่อกรอบและไม่มีเครื่องหมายถูก พร้อมระบบขยายภาพ OCR 2x + ขอบกันตัดคำให้อ่านประโยคครบไม่ขาดช่วง
              - **แถบเลื่อนตำแหน่งขึ้น-ลง (`0%–100%`) แยกอิสระทั้งฝั่งซ้ายและฝั่งขวา** ซิงค์ทั้งมือถือและทีวี Samsung
            - **ฐานข้อมูลซับ GTA 6 Part 1–4 (`15,868 ประโยค`, Local Cache 0ms) & สำนวนอเมริกันสมัยใหม่:**
              - รวมซับ **GTA 6 Part 1–4** กว่า **15,868 ประโยค** สำนวนอเมริกันเรียวๆ (คำหยาบ คำแสลง คำอุทานสมัยใหม่) ทั้งคลังแคชและ AI แปลสด
            - **บันทึกการตั้งค่าทั้งหมด & การเชื่อมต่อ PS5 ถาวร + โหมดทีวีจอดำ 100%:**
              - บันทึกการตั้งค่าและข้อมูลเชื่อมต่อ PS5 ถาวรหลังออกแอปและหลังอัปเดต พร้อมปุ่ม **`📺 โหมดทีวี`** และสำรอง/กู้คืนไฟล์ในแอป

            ---

            ### 📦 ไฟล์ติดตั้งในรีลีสนี้
            - สำหรับมือถือ/แท็บเล็ต Android: **`PS-Translator.apk`**
            - สำหรับทีวี Samsung (Tizen 2018+ ลงผ่านแอป Apps2Samsung): **`PS-Translator-Samsung-TV.wgt`**
          files: |
            dist/*.apk
            dist/*.wgt
          token: ${{ secrets.GITHUB_TOKEN }}
