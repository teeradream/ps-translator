name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          cp "$APK_FILE" dist/PS-Translator-Native.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.6
          name: "PS Translator v2.0.6 (Auto PSN ID, Native Audio Mute Fix & AI Character Voice)"
          body: |
            ### PS Translator v2.0.6

            - **Remember PSN Account ID:** บันทึกและดึงค่า PSN Account ID มากรอกให้อัตโนมัติทุกครั้งที่เข้าหน้าลงทะเบียน ไม่ต้องเสียเวลาค้นหาหรือคัดลอกใหม่
            - **Fix Mute Audio (No Voice Overlap):** แก้ปัญหากดปิดเสียงในแอปแล้วเสียงแปลไม่ดัง โดยเปลี่ยนไปสั่งปิดเฉพาะสัญญาณเสียงเกมจากสตรีมในระดับฮาร์ดแวร์ Native Stream ตรงๆ ทำให้เสียงเกมเงียบสนิท 100% แต่เสียงพากย์แปลภาษาไทยยังคงดังฟังชัดเจน ไม่มีเสียงเกมดังซ้อนกันอีกต่อไป
            - **AI Character Voice & Gender Selection:** เพิ่มระบบเลือกน้ำเสียงพากย์ตามเพศตัวละคร พร้อมโหมดวิเคราะห์เพศตัวละครอัจฉริยะ (AI Auto Gender) ที่ตรวจจับรูปประโยคและคำสรรพนามเพื่อสลับเสียงชาย-หญิงให้อัตโนมัติตามผู้พูดในเกม (หรือเลือกบังคับเสียงชาย/หญิงได้ตามชอบ)
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
