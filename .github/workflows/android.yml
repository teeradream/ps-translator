name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
    paths-ignore:
      - 'windows-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Pre-download OpenSSL source tarball
        run: |
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://mirror.math.princeton.edu/pub/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "http://mirrors.ibiblio.org/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1s/openssl-1.1.1s.tar.gz"
          cp openssl-1.1.1s.tar.gz app/ || true
          cp openssl-1.1.1s.tar.gz lib/ || true
          ls -lh openssl-1.1.1s.tar.gz

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.1.0
          name: "PS Translator v2.1.0 (Local Cache 0ms, 12,005 GTA 6 Subtitles, Auto Popup Zones & Multi-AI API)"
          body: |
            ### 🎮 PS Translator v2.1.0 (Android APK & Samsung DeX)

            แอปพลิเคชันสตรีมเกม PlayStation 5 (PS5) และ PS4 พร้อมระบบตรวจจับซับไตเติล แปลข้อความป๊อปอัพซ้าย/ขวา เอกสารเฉพาะจุด และพากย์เสียงไทยแบบเรียลไทม์ในดีไซน์ **Liquid Glass** (`PS-Translator.apk`)

            ---

            #### 🌟 ไฮไลต์ฟีเจอร์ใหม่ในเวอร์ชัน 2.1.0:
            - **ฐานข้อมูลคำแปลในเครื่อง (Local Cache 0ms + ฝังซับ GTA 6 Part 1–3 จำนวน 12,005 ประโยค):**
              - ฝังฐานข้อมูลคำแปลซับไตเติล **GTA 6 Part 1–3** (เนื้อเรื่องกว่า 10 ชั่วโมง 20 นาทีแรก) มาพร้อมในตัว APK ใช้งานได้ทันทีตั้งแต่เปิดแอปครั้งแรก
              - ระบบค้นหาอัจฉริยะ 3 ชั้น (**Exact Match `0ms`** → **OCR-Skeleton Match `0ms`** → **Exact Levenshtein Fuzzy `≥ 90%`**) จับคู่แม่นยำแม้ OCR ตอนเล่นจริงเพี้ยน 1–2 ตัวอักษร และแยกคลังซับเนื้อเรื่องออกจากกล่องข้อความแนะนำ (Popup) 100%
              - **ปุ่ม `"นำเข้า .DB"`:** นำเข้าไฟล์ฐานข้อมูล `.db` หรือ `.tsv` ของพาร์ทถัดๆ ไปหรือเกมอื่นมารวมเพิ่มในเครื่องได้ทันทีโดยไม่ต้องลงแอปใหม่
            - **โหมดโซนป๊อปอัพอัตโนมัติ (ซ้าย / ขวา) & ตัวกรองปุ่มกด HUD:**
              - ตรวจจับและแปลข้อความคำแนะนำด้านซ้ายและข้อความมือถือ/แจ้งเตือนด้านขวาอัตโนมัติ พร้อมตัวกรองปุ่มกด Action/HUD มุมล่างขวา
              - แสดงการ์ดคำแปลฝั่งเดียวกับต้นฉบับทั้งโหมดปกติและ **โหมดจอดำเต็มจอ (Text-Only Mode)**
              - ตั้งค่าแยกเสียงพากย์ป๊อปอัพได้อิสระ (**Smart Queue**, **Dual Channel พูดพร้อมกัน**, หรือ **ปิดเสียงพากย์ป๊อปอัพเพื่ออ่านอย่างเดียว**)
            - **Multi-Provider Translation API (7 ค่าย) + เซิร์ฟเวอร์สำรอง Google ฟรี:**
              - เลือกค่ายแปลได้อิสระ: **Google Translate (ฟรี + เซิร์ฟเวอร์สำรองอัตโนมัติ)**, **Gemini AI (`flash-lite`)**, **Groq (เร็วสุดในสาย AI)**, **Cerebras**, **OpenAI**, **OpenRouter**, และ **Custom OpenAI-Compatible URL**
              - เพิ่ม **สวิตช์เปิด/ปิดเสียงพากย์หลัก (Master Dubbing Toggle)** ในหน้าตั้งค่า API สำหรับสลับโหมดแปลตัวหนังสืออย่างเดียวได้ทันที
            - **Liquid Glass UI, Dual-Crop & Top Quick Drawer:**
              - เมนูกระจกโปร่งแสงพร้อมฟิสิกส์สปริง, กรอบซับสีเขียว + กรอบแปลเฉพาะจุดสีฟ้า/ป๊อปอัพซ้าย-ขวา, และลิ้นชักปุ่มลัดด้านบน (**พากย์ / เสียงเกม / ซับ / กรอบแปล / โหมดเฉพาะจุด-ป๊อปอัพ**)
            - **Smart Subtitle Cascade, 3-Mode TTS Queue & Samsung DeX:**
              - ซับเรียงซ้อน 1–3 แถว (`10–80 sp`), รองรับ **Samsung DeX** เต็มจอ/Pop-up, จอย **DualSense**, ระบบเล่นแบบ **2 บัญชี PSN บนทีวี 4K (0 ดีเลย์)** และส่งเสียงพากย์ออกหูฟัง Bluetooth อัตโนมัติ

            ---

            ### 📦 ไฟล์ติดตั้ง
            - ดาวน์โหลด: **`PS-Translator.apk`**
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
