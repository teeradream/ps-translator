name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          cp "$APK_FILE" dist/PS-Translator-Native.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.7
          name: "PS Translator v2.0.7 (1080p OCR, OCR Corrector, Speech Speed & Thai Male Voice Fix)"
          body: |
            ### PS Translator v2.0.7

            - **1080p Ultra-Clear OCR & 2x Scaling:** อัปเกรดระบบจับภาพตรวจจับซับไตเติ้ลขึ้นเป็นระดับ 1080p Full HD พร้อมประมวลผลขยายสเกล 2 เท่า ทำให้ฟอนต์ซับไตเติ้ลขนาดเล็กคมชัดสูงขึ้นมาก ตัวอักษรไม่เบลอติดกัน แยกแยะตัว c และ e ได้อย่างแม่นยำ สำหรับเกมที่ปรับขนาดซับไตเติ้ลไม่ได้
            - **Smart OCR Text Corrector:** เพิ่มระบบพจนานุกรมและตัวแก้ไขคำศัพท์ภาษาอังกฤษที่อ่านผิดพลาดระหว่าง c และ e โดยอัตโนมัติ ช่วยให้อ่านบทสนทนาได้ถูกต้องสมบูรณ์
            - **Adjustable Speech Speed:** เพิ่มปุ่มปรับระดับความเร็วเสียงพูดพากย์ (1.0x ปกติ, 1.25x แนะนำ, 1.5x เร็วทันใจ) ช่วยให้อ่านจบกระชับทันกับบทสนทนาในเกม
            - **Fixed Thai Male Voice:** แก้ไขระบบตรวจจับเสียงผู้ชายภาษาไทย (รองรับ thb, thc, cfn) พร้อมปรับลดระดับโทนเสียง Deep Tone (Pitch 0.68f) ให้ได้ยินเป็นเสียงผู้ชายทุ้มลึกอย่างสมจริง 100%
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
