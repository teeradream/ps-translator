name: Build PS Translator Windows 11 App

on:
  push:
    branches: [ main ]
    paths:
      - 'windows-app/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish PS-Translator-Windows (Single-File Self-Contained x64)
        shell: pwsh
        run: |
          dotnet publish windows-app/PSTranslatorWin.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish-win

          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item "publish-win/PS-Translator-Windows.exe" "dist-win/PS-Translator-Windows.exe"

      - name: Bundle Chiaki for Windows 11 & Create Portable Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle-win | Out-Null
          Copy-Item "publish-win/PS-Translator-Windows.exe" "bundle-win/PS-Translator-Windows.exe"

          try {
            $headers = @{ "User-Agent" = "PS-Translator-Builder" }
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/chiaki-ng/chiaki-ng/releases/latest" -Headers $headers
            $asset = $release.assets | Where-Object { $_.name -match "win_x64.*portable.*\.zip$" -or $_.name -match "win.*x64.*\.zip$" } | Select-Object -First 1
            if ($null -ne $asset) {
              Write-Host "Downloading Chiaki Windows from $($asset.browser_download_url)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "chiaki-win.zip"
              New-Item -ItemType Directory -Force -Path "bundle-win/Chiaki" | Out-Null
              Expand-Archive -Path "chiaki-win.zip" -DestinationPath "bundle-win/Chiaki" -Force
            }
          } catch {
            Write-Host "Optional Chiaki bundle step skipped: $_"
          }

          Compress-Archive -Path "bundle-win/*" -DestinationPath "dist-win/PS-Translator-Windows11-Portable.zip" -Force
          Get-ChildItem dist-win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-Windows11
          path: dist-win/*

      - name: Attach Windows 11 Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.8
          name: "PS Translator v2.0.8 (Android APK + Windows 11 Native App)"
          body: |
            ### PS Translator v2.0.8 (Android & Windows 11)

            #### 1. สำหรับคอมพิวเตอร์ Windows 11 (ใหม่ล่าสุด)
            - **PS-Translator-Windows.exe:** โปรแกรมแปลซับไตเติ้ลและพากย์เสียงภาษาไทยแบบเรียลไทม์สำหรับ Windows 11 (ไฟล์เดียวเปิดใช้งานได้ทันที ไม่ต้องติดตั้ง .NET เพิ่ม)
            - **PS-Translator-Windows11-Portable.zip:** ชุดรวมครบวงจร มีทั้งโปรแกรม `PS-Translator-Windows.exe` และโปรแกรมสตรีม `Chiaki` สำหรับ Windows 11 อยู่ในโฟลเดอร์เดียวกัน
            - **ฟีเจอร์ครบเหมือนเวอร์ชันมือถือ:** กรอบเขียวปรับขนาดและลากคลุมเฉพาะส่วนซับไตเติ้ล, ระบบขยายภาพ 2x Bicubic OCR พร้อมแก้คำผิด c/e อัตโนมัติ, แยกเสียงพากย์ชาย/หญิงด้วย AI + ปรับความเร็วเสียงพูด (1.0x / 1.25x / 1.5x), ปุ่มไฮไลท์สีเขียวชัดเจน, โหมดจอดำโชว์เฉพาะตัวหนังสือ และระบบจำค่า PSN Account ID

            #### 2. สำหรับมือถือและแท็บเล็ต Android (`PS-Translator.apk`)
            - **Fixed Voice Gender Mapping:** แก้ไขปัญหาการเลือกเสียงชายและหญิงสลับกันให้ตรงตามเพศจริง 100%
            - **Active Button Highlight UI:** เพิ่มแถบสีไฮไลท์สีเขียวชัดเจนบนปุ่มตัวเลือกที่กำลังใช้งานอยู่
            - **1080p Ultra-Clear OCR & Smart Corrector:** รองรับการตรวจจับซับไตเติ้ลความละเอียดสูง 1080p พร้อมขยายสเกล 2 เท่า และระบบแก้คำผิด c/e อัตโนมัติ
          files: |
            dist-win/PS-Translator-Windows.exe
            dist-win/PS-Translator-Windows11-Portable.zip
          token: ${{ secrets.GITHUB_TOKEN }}
