name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
    paths-ignore:
      - 'windows-app/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          cp "$APK_FILE" dist/PS-Translator-Native.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.8
          name: "PS Translator v2.0.8 (Samsung DeX Support, Android .APK & Native Chiaki Windows 11 .EXE)"
          body: |
            ### PS Translator v2.0.8 (Android APK + Samsung DeX & Native Chiaki Windows 11)

            #### 1. สำหรับมือถือ แท็บเล็ต Android และโหมด Samsung DeX (`PS-Translator.apk`)
            - **Full Samsung DeX & Multi-Window Support:** รองรับการเปิดใช้งานในโหมด **Samsung DeX** และโหมดหลายหน้าต่าง (Multi-Window / Pop-up View) เต็มรูปแบบ สามารถย่อ/ขยายขนาดหน้าต่างอย่างอิสระ สลับหน้าจอระหว่างจอมือถือกับจอแยก DeX และคลิกเมาส์ออกนอกหน้าต่างแอปได้โดยที่สตรีม PS5 และการแปลซับไตเติ้ลทำงานต่อเนื่องไม่หลุด (และไม่กระทบการทำงานแบบเต็มจอบนมือถือปกติ)
            - **Fixed Voice Gender Mapping:** แก้ไขปัญหาการเลือกเสียงชายและหญิงสลับกันให้ตรงตามเพศจริง 100%
            - **Active Button Highlight UI:** เพิ่มแถบสีไฮไลท์สีเขียวชัดเจนบนปุ่มตัวเลือกที่กำลังใช้งานอยู่
            - **1080p Ultra-Clear OCR & Smart Corrector:** รองรับการตรวจจับซับไตเติ้ลความละเอียดสูง 1080p พร้อมขยายสเกล 2 เท่า และระบบแก้คำผิด c/e อัตโนมัติ

            #### 2. สำหรับคอมพิวเตอร์ Windows 11 (`PS-Translator-Windows.exe` ไฟล์เดียวจบ)
            - **Native Chiaki Converted into Translator (เหมือนแอปมือถือ APK 100%):** แปลงโปรแกรมสตรีม PS5/PS4 (`libchiaki`) ให้มีระบบแปลซับไตเติ้ลและพากย์เสียงไทยในตัว ค้นหาเครื่อง PS5 ในวงแลน ลงทะเบียนด้วย PIN 8 หลัก ปลุกเครื่องจาก Rest Mode และสตรีมภาพ/เสียง/จอยเกม พร้อมแปลซับไตเติ้ลในโปรแกรมเดียว ไม่ต้องเปิดหลายโปรแกรม
            - **แสดงคำแปลอยู่ในหน้าต่างโปรแกรม (ไม่ลอยนอกหน้าต่าง):** กล่องซับไตเติ้ลและกรอบเขียวเลือกพื้นที่ซับไตเติ้ลอยู่ในหน้าต่างของโปรแกรมโดยตรง พร้อมโหมดขยายเต็มจอ (`F11`) และโหมดจอดำโชว์เฉพาะตัวหนังสือ
            - **ปรับขนาดและสีตัวหนังสือได้อิสระ:** ปรับขนาดตัวหนังสือภาษาไทย (16-72 px) และภาษาอังกฤษ (11-40 px) เลือกสีตัวหนังสือได้ตามต้องการ และมีปุ่มปิดเสียงเกมในตัว
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
