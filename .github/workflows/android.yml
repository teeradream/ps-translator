name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
    paths-ignore:
      - 'windows-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Pre-download OpenSSL source tarball
        run: |
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://mirror.math.princeton.edu/pub/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "http://mirrors.ibiblio.org/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1s/openssl-1.1.1s.tar.gz"
          cp openssl-1.1.1s.tar.gz app/ || true
          cp openssl-1.1.1s.tar.gz lib/ || true
          ls -lh openssl-1.1.1s.tar.gz

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK & Samsung TV WGT
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          cp tizen-tv/PS-Translator-Samsung-TV.wgt dist/PS-Translator-Samsung-TV.wgt
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: |
            dist/*.apk
            dist/*.wgt

      - name: Read app version from build.gradle
        id: ver
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n 1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VER"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "PS Translator ${{ steps.ver.outputs.tag }} (GTA 6 Part 1–4 15,868 Subtitles, Modern American Slang, Persistent Settings & PS5 Backup)"
          body: |
            ### 🎮 PS Translator ${{ steps.ver.outputs.tag }} (Android APK, Samsung TV `.wgt` & Samsung DeX)

            แอปพลิเคชันสตรีมเกม PlayStation 5 (PS5) และ PS4 พร้อมระบบตรวจจับซับไตเติล แปลข้อความป๊อปอัพซ้าย/ขวา เอกสารเฉพาะจุด ส่งซับลอยขึ้นทีวี Samsung และพากย์เสียงไทยแบบเรียลไทม์ในดีไซน์ **Liquid Glass**

            ---

            #### 🌟 ไฮไลต์ฟีเจอร์ล่าสุดในเวอร์ชัน ${{ steps.ver.outputs.version }}:
            - **ฐานข้อมูลซับ GTA 6 Part 1–4 (`15,868 ประโยค`, Local Cache 0ms) & สำนวนอเมริกันสมัยใหม่:**
              - เพิ่มซับ **GTA 6 Part 4** ครบทั้งคลิป รวมเป็น **15,868 ประโยค** (ครอบคลุมเนื้อเรื่องกว่า 13 ชั่วโมง 20 นาทีแรก) พร้อมอัปเกรดสำนวนภาษาพูดสไตล์อเมริกันเรียวๆ (คำหยาบ คำแสลง คำอุทานสมัยใหม่) ทั้งในคลังแคชและ Prompt AI แปลสด
            - **บันทึกการตั้งค่าทั้งหมด & การเชื่อมต่อ PS5 ถาวร (หลังออกแอป & หลังอัปเดต):**
              - บันทึกการตั้งค่าทุกอย่าง (รวมถึงสถานะปิดเสียงเกมและโหมดจอ) + บันทึก IP และการจับคู่ PS5 อัตโนมัติ พร้อมสำรองไฟล์ที่ `Documents/PS_Translator/ps_translator_backup.json` และปุ่ม **💾 ส่งออก / 📂 นำเข้าข้อมูลสำรอง** ในเมนูหน้าแรก
            - **ฟอนต์ผสม `GTA Art Deco + Prompt Light`, การ์ดแชท GTA 6 & ธีมเมนู Vice City:**
              - เปลี่ยนฟอนต์ทั้งแอปและทีวี Samsung เป็น **GTA Art Deco (อังกฤษ/ตัวเลข) + Prompt Light (ไทย)**, กรอบข้อความป๊อปอัพซ้าย/ขวาเป็นสไตล์ **GTA 6 Chat Bubble** พร้อมระบบ **รอข้อความพิมพ์จบก่อนแปล** และเมนูตั้งค่าธีม **Vice City**
            - **ส่งซับขึ้นทีวี Samsung โดยตรง (`PS-Translator-Samsung-TV.wgt`) & `📺 โหมดทีวี`:**
              - ปุ่ม **`📺 โหมดทีวี`** ปิดจอมือถือดำสนิท 100% + ล็อกสัมผัส (แตะ 2 ครั้งเพื่อปลดล็อก) ประหยัดแบตและกันจอเบิร์น, แถบสไลด์เลื่อนตำแหน่งซับขึ้น-ลงอิสระ `0%–100%`, และจับคู่ทีวี Samsung อัตโนมัติใน Wi-Fi บ้านใน 2 วินาที
            - **ระบบอัปเดตแอปในตัว (`อัปเดตแอปในตัว`) & ซิงค์ซับจากคลาวด์ (`ซิงค์ซับล่าสุด`):**
              - ใช้คีย์เซ็นชื่อถาวร อัปเดตทับเวอร์ชันใหม่ในแอปได้ทันทีโดยข้อมูลไม่หาย และกดซิงค์คลังซับล่าสุดจากคลาวด์ได้โดยไม่ต้องลง APK ใหม่

            ---

            ### 📦 ไฟล์ติดตั้งในรีลีสนี้
            - สำหรับมือถือ/แท็บเล็ต Android: **`PS-Translator.apk`**
            - สำหรับทีวี Samsung (Tizen 2018+ ลงผ่านแอป Apps2Samsung): **`PS-Translator-Samsung-TV.wgt`**
          files: |
            dist/*.apk
            dist/*.wgt
          token: ${{ secrets.GITHUB_TOKEN }}
