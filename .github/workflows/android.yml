name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
    paths-ignore:
      - 'windows-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Pre-download OpenSSL source tarball
        run: |
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://mirror.math.princeton.edu/pub/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "http://mirrors.ibiblio.org/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1s/openssl-1.1.1s.tar.gz"
          cp openssl-1.1.1s.tar.gz app/ || true
          cp openssl-1.1.1s.tar.gz lib/ || true
          ls -lh openssl-1.1.1s.tar.gz

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.11
          name: "PS Translator v2.0.11 (Expanded Font Size 10-80sp & Slider)"
          body: |
            ### 🎮 PS Translator v2.0.11 (Android APK & Samsung DeX)

            แอปพลิเคชันสตรีมเกม PlayStation 5 (PS5) และ PS4 พร้อมระบบแปลภาษาและพากย์เสียงไทยแบบเรียลไทม์ สำหรับอุปกรณ์ Android และ Samsung DeX (`PS-Translator.apk`)

            ---

            #### 🌟 ไฮไลต์ฟีเจอร์ใหม่ในเวอร์ชัน 2.0.11:
            - **Expanded Font Size Settings (ขยายช่วงขนาดตัวหนังสือเป็น `10 sp – 80 sp`):**
              - ปรับขนาดตัวหนังสือได้กว้างขึ้นมาก รองรับทุกขนาดหน้าจอ ตั้งแต่มือถือจอเล็ก แท็บเล็ต ไปจนถึงจอใหญ่ / Samsung DeX / ทีวี
              - เพิ่มแถบสไลเดอร์ (`SeekBar`) สำหรับเลื่อนปรับละเอียดทีละ `1 sp`
              - อัปเดตปุ่มลัด 5 ระดับ (`16 / 26 / 40 / 56 / 72 sp`) พร้อมปุ่ม `A-` และ `A+` (ทีละ `2 sp`)
              - ควบคุมขนาดพรีวิวในเมนูตั้งค่าให้พอดีหน้าจอ โดยไม่กระทบเลย์เอาต์และฟังก์ชันอื่น
            - **Smart Subtitle Cascade & Live Styling:**
              - ซับไตเติลเรียงซ้อน 1-3 แถว ไล่ระดับความจาง เลือกตำแหน่งกลางจอ/ล่างจอ เลือกสีตัวหนังสือได้ 6 สี และปรับความโปร่งใสพื้นหลังได้ 4 ระดับ
            - **Thai Voice Dubbing & TTS Queue:**
              - พากย์เสียงไทยอัตโนมัติ แยกเสียงชาย-หญิง ปรับความเร็วเสียงพูด (`1.0x – 1.5x`) พร้อม 3 โหมดคิวเสียงพูด และปุ่มปิดเฉพาะเสียงเกม
            - **Samsung DeX & Multi-Window:** รองรับการทำงานแบบ Pop-up / ย่อขยายหน้าต่าง / สตรีมเกมต่อเนื่องขณะทำงานอื่นบน DeX

            ---

            ### 📦 ไฟล์ติดตั้ง
            - ดาวน์โหลด: **`PS-Translator.apk`**
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
