name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          cp "$APK_FILE" dist/PS-Translator-Native.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.5
          name: "PS Translator v2.0.5 (Adjustable Subtitle Crop Box & Anti-Flicker Engine)"
          body: |
            ### PS Translator v2.0.5

            - **Adjustable Subtitle Detection Box:** เพิ่มฟังก์ชันปรับตำแหน่งและขนาดของกรอบอ่านซับไตเติ้ลบนหน้าจอได้อิสระ ลากหรือย่อขยายกรอบสีเขียวไปยังจุดที่มีซับไตเติ้ลเกมได้ตามต้องการ ไม่จับเมนูปุ่มด้านข้างอีกต่อไป
            - **Anti-Flicker & Stability Engine:** ระบบลดการกระพริบและความเสถียรของซับไตเติ้ล ด้วยการเปรียบเทียบความคล้ายคลึงของข้อความ (Similarity Check) ไม่แปลซ้ำคำเดิมที่มีเพียงการขยับของตัวอักษรเล็กน้อย
            - **Filter Short UI Prompts:** กรองปุ่มกดและคำสั่งสั้นๆ (เช่น Talk, Skip, R1, R2, L1, L2) ออก เพื่อเน้นอ่านเฉพาะบทสนทนาของตัวละคร
            - **Smooth Subtitle Persistence:** แสดงข้อความซับไตเติ้ลค้างไว้ 4.5 วินาทีอย่างนุ่มนวลก่อนค่อยๆ จางหายไป เพื่อให้อ่านได้อย่างสบายตา
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
