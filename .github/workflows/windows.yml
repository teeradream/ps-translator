name: Build PS Translator Windows 11 App

on:
  push:
    branches: [ main ]
    paths:
      - 'windows-app/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish All-in-One PS-Translator-Windows.exe (Single-File Self-Contained x64)
        shell: pwsh
        run: |
          dotnet publish windows-app/PSTranslatorWin.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish-win

          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item "publish-win/PS-Translator-Windows.exe" "dist-win/PS-Translator-Windows.exe"
          Get-ChildItem dist-win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-Windows11
          path: dist-win/PS-Translator-Windows.exe

      - name: Attach Windows 11 All-in-One Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.8
          name: "PS Translator v2.0.8 (All-in-One Windows 11 .EXE & Android .APK)"
          body: |
            ### PS Translator v2.0.8 (All-in-One Windows 11 & Android APK)

            #### 1. สำหรับคอมพิวเตอร์ Windows 11 (`PS-Translator-Windows.exe` ไฟล์เดียวจบ)
            - **All-in-One Single Window (เหมือนแอปมือถือ APK):** รวมหน้าจอแสดงภาพเกม กรอบเขียวเลือกพื้นที่ซับไตเติ้ล และกล่องแสดงคำแปลภาษาไทยไว้ในหน้าต่างโปรแกรมเดียวกัน ไม่ต้องเปิดหลายโปรแกรม และไม่มีกรอบข้อความลอยเกะกะนอกโปรแกรม
            - **ปรับขนาดและสีของตัวหนังสือได้อย่างอิสระ:** ปรับขนาดตัวอักษรภาษาไทย (16-72 px) และภาษาอังกฤษ (11-40 px) พร้อมปุ่มเลือกสีตัวหนังสือ (เหลืองทอง, ขาว, เขียว, ฟ้าสว่าง, ชมพู, ส้ม) และปรับความทึบพื้นหลังกล่องซับไตเติ้ลได้ตามต้องการ
            - **โหมดขยายเต็มจอ (Fullscreen F11) และโหมดเฉพาะตัวหนังสือ (จอดำ):** กดขยายเต็มจอเหมือนมือถือ เลือกอัตราส่วนภาพ (16:9 / Fit / Stretch) หรือสลับเป็นโหมดจอดำแสดงเฉพาะคำแปลได้ทันที
            - **ปุ่มปิดเสียงเกมแยกอิสระ:** ปิดเฉพาะเสียงเกมเพื่อให้ได้ยินเสียงพากย์ไทย AI (ชาย/หญิง/อัตโนมัติ) ชัดเจนโดยเสียงไม่ตีกัน

            #### 2. สำหรับมือถือและแท็บเล็ต Android (`PS-Translator.apk`)
            - **Fixed Voice Gender Mapping:** แก้ไขปัญหาการเลือกเสียงชายและหญิงสลับกันให้ตรงตามเพศจริง 100%
            - **Active Button Highlight UI:** เพิ่มแถบสีไฮไลท์สีเขียวชัดเจนบนปุ่มตัวเลือกที่กำลังใช้งานอยู่
            - **1080p Ultra-Clear OCR & Smart Corrector:** รองรับการตรวจจับซับไตเติ้ลความละเอียดสูง 1080p พร้อมขยายสเกล 2 เท่า และระบบแก้คำผิด c/e อัตโนมัติ
          files: |
            dist-win/PS-Translator-Windows.exe
          token: ${{ secrets.GITHUB_TOKEN }}
