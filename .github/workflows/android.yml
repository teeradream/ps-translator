name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
    paths-ignore:
      - 'windows-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Pre-download OpenSSL source tarball
        run: |
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://mirror.math.princeton.edu/pub/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "http://mirrors.ibiblio.org/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1s/openssl-1.1.1s.tar.gz"
          cp openssl-1.1.1s.tar.gz app/ || true
          cp openssl-1.1.1s.tar.gz lib/ || true
          ls -lh openssl-1.1.1s.tar.gz

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK & Samsung TV WGT
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          cp tizen-tv/PS-Translator-Samsung-TV.wgt dist/PS-Translator-Samsung-TV.wgt
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: |
            dist/*.apk
            dist/*.wgt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.3
          name: "PS Translator v2.2.3 (Persistent APK Signing for In-App Updates, Vertical Subtitle Slider & Samsung TV Fix)"
          body: |
            ### 🎮 PS Translator v2.2.3 (Android APK, Samsung TV `.wgt` & Samsung DeX)

            แอปพลิเคชันสตรีมเกม PlayStation 5 (PS5) และ PS4 พร้อมระบบตรวจจับซับไตเติล แปลข้อความป๊อปอัพซ้าย/ขวา เอกสารเฉพาะจุด ส่งซับลอยขึ้นทีวี Samsung และพากย์เสียงไทยแบบเรียลไทม์ในดีไซน์ **Liquid Glass**

            ---

            #### 🌟 ไฮไลต์ฟีเจอร์ใหม่ในเวอร์ชัน 2.2.0:
            - **ส่งซับขึ้นทีวี Samsung โดยตรง (`PS-Translator-Samsung-TV.wgt`):**
              - มีไฟล์แอปทีวี **`PS-Translator-Samsung-TV.wgt`** ให้ดาวน์โหลดติดตั้งลงทีวี Samsung (Tizen 2018+) เพื่อดึงภาพพอร์ต HDMI (PS5) ขึ้นมาเป็นพื้นหลังและวางซับไทย + ป๊อปอัพซ้าย/ขวา + โน้ตแปลเฉพาะจุดลอยทับบนจอทีวีโดยตรง
              - **จับคู่อัตโนมัติใน Wi-Fi บ้าน:** เปิดแอปบนทีวีและมือถือในวง Wi-Fi เดียวกัน แอปจะเชื่อมต่อกันเองใน 2 วินาทีโดยไม่ต้องพิมพ์รหัส 6 หลัก และควบคุมขนาด/สี/ตำแหน่งซับจากมือถือได้แบบเรียลไทม์
            - **ระบบอัปเดตแอปในตัว (In-App Auto-Updater) & ซิงค์คลังซับจากคลาวด์:**
              - **ปุ่ม `"อัปเดตแอปในตัว"`:** ดาวน์โหลดและสั่งติดตั้งเวอร์ชันใหม่จากในแอปโดยตรงพร้อมเปอร์เซ็นต์ความคืบหน้า ไม่ต้องเปิดเว็บไปโหลดไฟล์ใหม่เอง
              - **ปุ่ม `"ซิงค์ซับล่าสุด"`:** ดึงฐานข้อมูลคำแปลพาร์ทใหม่ๆ จากคลาวด์เข้าเครื่องได้ทันทีโดยไม่ต้องลง APK ใหม่ (และฝั่งทีวี `.wgt` อัปเดตหน้าตาซับตามมือถืออัตโนมัติโดยไม่ต้องลงไฟล์ `.wgt` ใหม่)
            - **ซับค้างอ่านง่าย & ซ่อนอัตโนมัติใน 10 วินาที:**
              - ซับไตเติลจะแสดงค้างให้อ่านสบายตา และจะซ่อนหน้าต่างซับอัตโนมัติเมื่อไม่มีบทพูดใหม่เข้ามาครบ **10 วินาที** (ทั้งบนจอมือถือและบนทีวี Samsung)
            - **หน้าต่างตั้งค่าขนาดตัวหนังสือคงที่:**
              - นำกล่องตัวอย่างซับในหน้าตั้งค่าออกเพื่อไม่ให้หน้าต่างตั้งค่าขยายใหญ่หรือขยับตามขนาดฟอนต์เวลาเลื่อนปรับ
            - **ฐานข้อมูลคำแปลในเครื่อง (Local Cache 0ms + ซับ GTA 6 Part 1–3 จำนวน 12,005 ประโยค):**
              - ฝังฐานข้อมูลซับ **GTA 6 Part 1–3** (เนื้อเรื่องกว่า 10 ชั่วโมง 20 นาทีแรก) มาพร้อมในตัว APK พร้อมระบบค้นหา 3 ชั้น (`Exact` → `OCR-Skeleton` → `Exact Levenshtein ≥ 90%`) และปุ่ม **`"นำเข้า .DB"`**

            ---

            ### 📦 ไฟล์ติดตั้งในรีลีสนี้
            - สำหรับมือถือ/แท็บเล็ต Android: **`PS-Translator.apk`**
            - สำหรับทีวี Samsung (Tizen 2018+ ลงผ่านแอป Apps2Samsung): **`PS-Translator-Samsung-TV.wgt`**
          files: |
            dist/*.apk
            dist/*.wgt
          token: ${{ secrets.GITHUB_TOKEN }}
