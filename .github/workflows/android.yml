name: Build PS Translator Native APK

on:
  push:
    branches: [ main, native ]
    paths-ignore:
      - 'windows-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: |
          pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Pre-download OpenSSL source tarball
        run: |
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://mirror.math.princeton.edu/pub/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "http://mirrors.ibiblio.org/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1s/openssl-1.1.1s.tar.gz"
          cp openssl-1.1.1s.tar.gz app/ || true
          cp openssl-1.1.1s.tar.gz lib/ || true
          ls -lh openssl-1.1.1s.tar.gz

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PS-Translator.apk
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.12
          name: "PS Translator v2.0.12 (Liquid Glass UI, Gemini AI, Dual-Crop & Top Quick Drawer)"
          body: |
            ### 🎮 PS Translator v2.0.12 (Android APK & Samsung DeX)

            แอปพลิเคชันสตรีมเกม PlayStation 5 (PS5) และ PS4 พร้อมระบบแปลซับไตเติล เอกสารเฉพาะจุด และพากย์เสียงไทยแบบเรียลไทม์ในดีไซน์ **Liquid Glass** (`PS-Translator.apk`)

            ---

            #### 🌟 ไฮไลต์ฟีเจอร์ใหม่ในเวอร์ชัน 2.0.12:
            - **Liquid Glass UI & Tactile Spring Physics:**
              - เมนูตั้งค่ากระจกโปร่งแสงขอบสะท้อนแสง เด้งออกจากปุ่ม `☰` พร้อมฟิสิกส์สปริงเวลาลากและปุ่มยวบ/เด้งกลับเวลาแตะ
              - ปรับดีไซน์หน้าต่างซับ, หน้าต่างแปลเฉพาะจุด และลิ้นชักด้านบนให้เป็นสไตล์ Liquid Glass ทั้งชุด
            - **Dual Crop Box (กรอบซับสีเขียว + กรอบแปลเฉพาะจุดสีฟ้า):**
              - แยกกรอบสำหรับอ่านเอกสาร/ชีต/ข้อความแนะนำในเกม กดปุ่มไอคอนวงกลมเพื่อแปลแบบไม่ชนกับซับ
              - แสดงหน้าต่างแยกพร้อมปุ่ม **กากบาท (`✕`)**, ปุ่ม **ฟังเสียงพากย์**, และปิดเองอัตโนมัติใน **20 วินาที** (ใช้งานได้แม้เปิดจอดำเต็มจอ โดยซับจะเลื่อนลงด้านล่างชั่วคราว)
            - **Top Quick Drawer (ลิ้นชักปุ่มลัดด้านบน):**
              - แตะหรือปัดแถบโปร่งแสงตรงกลางขอบบนเพื่อเปิด/ปิดด่วน 4 ปุ่ม: **พากย์**, **เสียงเกม**, **ซับ**, และ **จอดำ** (ซ่อนอัตโนมัติใน 4 วินาที)
            - **Gemini API Key (แปลคำแสลง/สบถ & พากย์ AI):**
              - รองรับการใส่ **Gemini API Key** เพื่อแปลบทสนทนาเกม คำแสลง และคำสบถให้ตรงอารมณ์ (`BLOCK_NONE`) + พากย์เสียง AI (สลับกลับระบบฟรีอัตโนมัติเมื่อไม่ใส่คีย์หรือโควตาเต็ม)
            - **Smart Subtitle Cascade & 3-Mode TTS Queue:**
              - ซับเรียงซ้อน 1-3 แถว (`10–80 sp`), คงหน้าต่างซับไม่จางหาย, ป้องกันแปลซ้ำ/พากย์ซ้ำ, รองรับ 3 โหมดคิวเสียง (`อ่านจบประโยค`, `ทันใจตามซับใหม่`, `Smart Queue`) และจำค่าการตั้งค่าทั้งหมดถาวร
            - **Samsung DeX & Multi-Window & Bluetooth:** รองรับ DeX เต็มจอ/Pop-up, จอย DualSense, และส่งเสียงพากย์ออกหูฟัง Bluetooth อัตโนมัติ

            ---

            ### 📦 ไฟล์ติดตั้ง
            - ดาวน์โหลด: **`PS-Translator.apk`**
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
