name: Build PS Translator Windows 11 App

on:
  push:
    branches: [ main ]
    paths:
      - 'gui/**'
      - 'lib/**'
      - 'windows-app/**'
      - '.github/workflows/windows.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  build-chiaki-desktop:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Protobuf
        shell: pwsh
        run: |
          python -m pip install "protobuf==3.19.5"
          $pyPath = (Get-Command python).Source
          echo "PYTHON_BIN=$pyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Configured Python at: $pyPath"
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Recurse -Filter "python.exe" | ForEach-Object {
              & $_.FullName -m pip install "protobuf==3.19.5" --disable-pip-version-check
            }
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Qt 5.15.2
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Download Build Tools & Dependencies (Protoc, Ninja, FFmpeg, SDL2, OpenSSL, Opus)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Protoc
          Write-Host "Downloading Protoc 3.19.4..."
          curl.exe -fL --retry 3 -o protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v3.19.4/protoc-3.19.4-win64.zip"
          7z x protoc.zip -oC:\protoc -y
          echo "C:\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # 2. Ninja
          Write-Host "Downloading Ninja..."
          curl.exe -fL --retry 3 -o ninja.zip "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip"
          7z x ninja.zip -oC:\ninja -y
          echo "C:\ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # 3. FFmpeg Win64 Shared SDK
          Write-Host "Downloading FFmpeg SDK..."
          curl.exe -fL --retry 5 --retry-delay 2 -o ffmpeg.zip "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          7z x ffmpeg.zip -offmpeg-sdk -y
          $ffDir = (Get-ChildItem -Path ffmpeg-sdk -Directory).FullName
          echo "FFMPEG_DIR=$ffDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # 4. SDL2 VC
          Write-Host "Downloading SDL2..."
          curl.exe -fL --retry 3 -o SDL2.zip "https://www.libsdl.org/release/SDL2-devel-2.26.2-VC.zip"
          7z x SDL2.zip -y
          $sdlDir = (Get-ChildItem -Directory -Filter "SDL2-2.26.2").FullName
          $sdlNorm = $sdlDir.Replace("\", "/")
          $sdlCfg = "set(SDL2_INCLUDE_DIRS `"$sdlNorm/include`")`nset(SDL2_LIBRARIES `"$sdlNorm/lib/x64/SDL2.lib`")`nset(SDL2_LIBDIR `"$sdlNorm/lib/x64`")`ninclude(`"$sdlNorm/cmake/sdl2-config-version.cmake`")"
          Set-Content -Path "$sdlDir\SDL2Config.cmake" -Value $sdlCfg
          echo "SDL2_DIR=$sdlDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # 5. OpenSSL 1.1.1w (slproweb)
          Write-Host "Downloading and installing OpenSSL 1.1.1..."
          curl.exe -L -sS -o openssl-setup.exe "https://slproweb.com/download/Win64OpenSSL-1_1_1w.exe"
          Start-Process -FilePath ".\openssl-setup.exe" -ArgumentList "/SILENT /VERYSILENT /SP- /DIR=C:\OpenSSL-Win64" -Wait
          echo "OPENSSL_DIR=C:\OpenSSL-Win64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # 6. Build Opus
          Write-Host "Building Opus..."
          git clone --depth 1 https://github.com/xiph/opus.git
          $env:PATH = "C:\ninja;$env:PATH"
          cmake -B opus/build -S opus -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/opus-prefix"
          ninja -C opus/build install
          echo "OPUS_DIR=$PWD/opus-prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # 7. Tesseract OCR for Windows (Offline Standalone OCR engine)
          Write-Host "Downloading Tesseract OCR..."
          curl.exe -fL --retry 3 -o tesseract-setup.exe "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-v5.3.0.20221214.exe"
          7z x tesseract-setup.exe -oC:\tesseract-dist -y

      - name: Build Chiaki v2.2.0 C++ GUI with PS-Translator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "C:\ninja;C:\protoc\bin;$env:PATH"

          $buildDir = "build-chiaki"
          cmake -B $buildDir -S . `
            -G Ninja `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CXX_FLAGS=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" `
            -DCHIAKI_ENABLE_GUI=ON `
            -DCHIAKI_ENABLE_CLI=OFF `
            -DCHIAKI_ENABLE_TESTS=OFF `
            -DCHIAKI_ENABLE_ANDROID=OFF `
            -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
            "-DCMAKE_PREFIX_PATH=$env:FFMPEG_DIR;$env:OPUS_DIR;C:\OpenSSL-Win64;$env:SDL2_DIR" `
            "-DFFMPEG_ROOT=$env:FFMPEG_DIR" `
            "-DSDL2_DIR=$env:SDL2_DIR" `
            "-DOPENSSL_ROOT_DIR=C:\OpenSSL-Win64" `
            "-DPYTHON_EXECUTABLE=$env:PYTHON_BIN"
          if ($LASTEXITCODE -ne 0) { throw "CMake failed with exit code $LASTEXITCODE" }

          ninja -C $buildDir chiaki
          if ($LASTEXITCODE -ne 0) { throw "Ninja failed with exit code $LASTEXITCODE" }

          # Create distribution package
          New-Item -ItemType Directory -Force -Path "dist-chiaki" | Out-Null
          Copy-Item "$buildDir/gui/chiaki.exe" "dist-chiaki/chiaki.exe"

          # Deploy Qt dependencies
          $windeploy = (Get-Command windeployqt.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $windeploy) {
            $windeploy = (Get-ChildItem -Path "$env:RUNNER_WORKSPACE", "$env:Qt5_Dir", "C:\Qt", "D:\a" -Recurse -Filter "windeployqt.exe" -ErrorAction SilentlyContinue | Select-Object -First 1)?.FullName
          }
          if (-not $windeploy) {
            $windeploy = "windeployqt.exe"
          }
          Write-Host "Using windeployqt: $windeploy"
          & $windeploy dist-chiaki/chiaki.exe --no-compiler-runtime

          # Copy Runtime DLLs
          Copy-Item "$env:FFMPEG_DIR/bin/*.dll" "dist-chiaki/" -Force
          Copy-Item "$env:SDL2_DIR/lib/x64/SDL2.dll" "dist-chiaki/" -Force
          Copy-Item "$env:OPENSSL_DIR/bin/*.dll" "dist-chiaki/" -Force
          Copy-Item "$env:OPUS_DIR/bin/*.dll" "dist-chiaki/" -Force -ErrorAction SilentlyContinue

          # Deploy Tesseract OCR inside dist-chiaki/tesseract/
          New-Item -ItemType Directory -Force -Path "dist-chiaki/tesseract" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist-chiaki/tesseract/tessdata" | Out-Null
          Copy-Item "C:\tesseract-dist\tesseract.exe" "dist-chiaki/tesseract\"
          Copy-Item "C:\tesseract-dist\*.dll" "dist-chiaki/tesseract\" -Exclude "icu*.dll"
          Copy-Item "C:\tesseract-dist\tessdata\eng.traineddata" "dist-chiaki/tesseract/tessdata\"

          # Also package standalone tesseract-win64.zip for users who only replaced chiaki.exe
          7z a -tzip tesseract-win64.zip ./dist-chiaki/tesseract/*

          # Also copy chiaki.exe directly as chiaki-translator.exe for single drop-in replacement
          Copy-Item "$buildDir/gui/chiaki.exe" "chiaki.exe"

          # Compress complete folder into ZIP package
          7z a -tzip Chiaki-Translator-v2.2.0-Windows.zip ./dist-chiaki/*

          Get-ChildItem -Path "dist-chiaki"
          Get-ChildItem -Filter "*.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Translator-v2.2.0-Windows
          path: |
            Chiaki-Translator-v2.2.0-Windows.zip
            chiaki.exe
            tesseract-win64.zip

      - name: Attach Chiaki Translator v2.2.0 to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.8
          name: "PS Translator v2.0.8 (Chiaki v2.2.0 Native Windows Translator, Android APK & DeX)"
          body: |
            ### PS Translator v2.0.8 (Native Chiaki v2.2.0 Windows 11 & Android APK)

            #### 1. สำหรับคอมพิวเตอร์ Windows 11 (Chiaki v2.2.0 Native Translator)
            - **แปลงจากซอร์สโค้ดแท้ของ Chiaki v2.2.0 (ตรงกับ `chiaki-2-2-0`):** แปลงโปรแกรม Chiaki v2.2.0 C++/Qt6 โดยตรง ให้มีระบบแปลซับไตเติ้ลภาษาไทยและเสียงพากย์ไทย AI ในตัว 100%
            - **มีระบบ OCR ออฟไลน์ในตัว (Tesseract OCR + Windows WinRT OCR):** ไม่ต้องพึ่งพาแพ็กเกจภาษาของ Windows อีกต่อไป ทำงานแบบออฟไลน์ 100% เหมือนแอปมือถือ APK
            - **ใช้งานได้ 2 รูปแบบ:**
              1. **วิธีที่ 1 (ชุดสมบูรณ์ แนะนำที่สุด):** ดาวน์โหลดไฟล์ `Chiaki-Translator-v2.2.0-Windows.zip` แตกไฟล์แล้วเปิดเล่นได้ทันที มีโมดูล OCR และไฟล์ครบถ้วน ไม่ต้องตั้งค่าอะไรเพิ่ม
              2. **วิธีที่ 2 (ผู้ที่ต้องการใช้โฟลเดอร์เดิม):** ดาวน์โหลด `chiaki.exe` วางทับ และดาวน์โหลด `tesseract-win64.zip` แตกไฟล์ไว้ในโฟลเดอร์เดียวกัน
            - **กรอบอ่านซับและคำแปลอยู่ในหน้าต่างเกม (ไม่ลอยออกนอกจอ):** ปรับขนาด ลากย้ายตำแหน่งกรอบเขียว และกล่องซับไตเติ้ลได้อิสระ พร้อมขยายเต็มจอ (`F11`) ไปพร้อมกัน
            - **เมนูตั้งค่าวงกลม `☰` ในตัว:** แสดงสถานะ OCR แบบเรียลไทม์, ปุ่มเปิด/ปิดกรอบเขียว, ปรับขนาดตัวหนังสือไทย/อังกฤษ (16-72 pt), เลือกสีตัวหนังสือ 6 สี, ปรับความทึบพื้นหลัง, ปรับเพศเสียงพากย์, และมีปุ่มปิดเสียงเกมในตัว

            #### 2. สำหรับมือถือและแท็บเล็ต Android (`PS-Translator.apk`)
            - รองรับ Samsung DeX และ Multi-Window เต็มรูปแบบ
            - แก้ไขการสลับเพศเสียงพากย์ชาย/หญิงตรงตามจริง 100%
          files: |
            Chiaki-Translator-v2.2.0-Windows.zip
            chiaki.exe
            tesseract-win64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
