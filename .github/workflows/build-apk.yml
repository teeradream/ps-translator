name: Build PS Translator Android APK & Release

on:
  push:
    branches: [ "main", "master", "feat/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Capacitor & Generate Android Native Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../PS-Translator.apk

      - name: Upload PS-Translator.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Translator-APK
          path: PS-Translator.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          git tag -f v1.0.0
          git push origin -f v1.0.0
          gh release create v1.0.0 PS-Translator.apk \
            --title "PS Translator v1.0.0 (Android APK + WebApp)" \
            --notes "ดาวน์โหลดไฟล์ **PS-Translator.apk** ด้านล่างเพื่อติดตั้งลงมือถือ Android ได้ทันที หรือเปิดใช้งานผ่าน WebApp บน iPad และ PC"
